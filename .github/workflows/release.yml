name: Release UserScripts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build UserScripts
        run: npm run build
        env:
          SCRIPT_VERSION: ${{ github.ref_name }}

      - name: Verify build outputs
        run: |
          ls -la dist/
          test -f dist/gemini-markdown-exporter.user.js
          test -f dist/google-ai-mode-exporter.user.js
          test -f dist/vertex-ai-search-markdown-exporter.user.js

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*.user.js'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.user.js
          generate_release_notes: true
          draft: false
          prerelease: false
